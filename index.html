<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Topblocks</title>
  <link rel="icon" href="data:," />
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b1220;
      --panel: #182235;
      --panel-2: #111827;
      --text: #e5eefc;
      --muted: #8ea2be;
      --border: #2e415f;
      --accent: #70a5ff;
      --accent-2: #d4a258;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      background:
        linear-gradient(180deg, #07101c 0%, var(--bg) 70%, #060c15 100%);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overflow: hidden;
    }

    .app {
      height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr;
      gap: 12px;
      padding: 14px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 14px;
      background: color-mix(in srgb, var(--panel) 94%, black);
      border: 1px solid var(--border);
      border-radius: 14px;
    }

    h1 {
      margin: 0;
      font-size: 18px;
      letter-spacing: 0;
    }

    .subtitle {
      margin-top: 3px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.35;
      white-space: nowrap;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    label {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--muted);
      font-size: 13px;
      white-space: nowrap;
    }

    input, button {
      height: 34px;
      border-radius: 9px;
      border: 1px solid var(--border);
      background: var(--panel-2);
      color: var(--text);
      padding: 0 10px;
      font: inherit;
    }

    input[type="text"] { width: 150px; }
    input[type="range"] { width: 120px; padding: 0; }

    button {
      cursor: pointer;
      background: #2b3d58;
    }

    button:hover {
      background: #39516f;
    }

    .stage {
      min-height: 0;
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      background: #08111d;
      position: relative;
    }

    #game {
      width: 100%;
      height: 100%;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
      cursor: grab;
    }

    canvas.dragging {
      cursor: grabbing;
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="topbar">
      <div>
        <h1>Topblocks</h1>
        <div id="status" class="subtitle"></div>
      </div>
      <div class="controls">
        <input id="seedInput" type="text" aria-label="Seed" value="topblocks-001" />
        <label>Сила
          <input id="blastInput" type="range" min="20" max="100" value="60" />
          <span id="blastLabel">60%</span>
        </label>
        <button id="applyBtn">Применить seed</button>
        <button id="randomBtn">Случайный seed</button>
        <button id="centerBtn">В центр</button>
      </div>
    </section>
    <section class="stage">
      <div id="game"></div>
    </section>
  </main>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
